<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GODBOX Cosmic People Study</title>
<style>body{margin:0;background:#111620;color:#e1e3df;font:14px system-ui}header{display:flex;align-items:center;gap:16px;padding:16px 24px}h1{font-size:17px;margin:0 auto 0 0}select,button{background:#25303c;color:inherit;padding:7px;border:1px solid #566575;border-radius:4px}canvas{display:block;width:100%;height:calc(100vh - 130px)}footer{padding:12px 24px;line-height:1.6;color:#b8c3d0}</style></head>
<body><header><h1>GODBOX / Cosmic people · production asset study</h1>
<select id="camera" aria-label="Camera"><option value="close">Close</option><option selected value="normal">Normal street view</option><option value="overview">Settlement overview</option></select>
<select id="lighting" aria-label="Lighting"><option value="day">Day</option><option value="night">Night</option></select>
<select id="terrain" aria-label="Terrain"><option value="grass">Grass</option><option value="snow">Bright stone / snow</option><option value="dark">Dark terrain</option></select>
<select id="activity" aria-label="Activity"><option value="walk">Walk</option><option value="carry">Carry</option><option value="build">Build</option><option value="gather">Gather</option><option value="rest">Rest</option></select><button id="pause">Pause</button></header>
<canvas></canvas><footer>Front: farmer · fisher · builder · merchant · guard · priest. Back: administrator · scholar · engineer · healer · elder · child.<br><span id="status"></span></footer><script type="module" src="./cosmic-people-preview.ts"></script></body></html>
