<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Arrival Day — visual review</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#101818;color:#e1dfd4;font:13px system-ui}header{height:100px;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{background:#27332f;border:1px solid #536157;color:inherit;padding:8px;cursor:pointer}iframe{width:100%;height:calc(100vh - 100px);border:0}output{font-variant-numeric:tabular-nums;color:#b8c4b7}strong{margin-right:10px}
</style></head><body>
<header><strong>ARRIVAL DAY / REVIEW</strong>
<select aria-label="Arrival moment" id="moment">
<option value="0">Pristine world ? 0s</option><option value="5">Arrival ? 5s</option><option value="12">Descent ? 12s</option><option value="17">First touchdown ? 17s</option><option value="20">Emergence ? 20s</option><option value="27">Gathering ? 27s</option><option value="35">Arrival Day ? 35s</option><option value="38">Human handoff ? 38s</option>
</select><button id="seek">Inspect</button><button id="play">Play / pause</button><button id="step">+ 0.25s</button><button id="restart">Restart from zero</button><output id="status">Loading the deterministic preview seed…</output></header>
<div style="padding:8px 20px"><button id="month">History +1 month</button> <button id="year">History +12 months</button> <span id="shelter"></span></div>
<iframe src="/?arrival-preview" title="Production GODBOX arrival"></iframe>
<script type="module" src="/tests/arrival-preview.ts"></script></body></html>
