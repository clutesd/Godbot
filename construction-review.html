<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GODBOX construction review</title>
<style>body{margin:0;background:#c5c7b5;color:#f5ead7;font:14px system-ui}canvas{display:block}aside{position:fixed;top:18px;left:18px;width:270px;padding:20px;background:#182725ed;border-radius:12px}h1{font-size:18px;margin:0 0 10px}p{font-size:12px;color:#b7c9be;line-height:1.5}label{display:block;margin:12px 0 5px}select,button{background:#344c43;color:#fff;border:1px solid #718379;border-radius:5px;padding:7px;margin:3px 0}input[type=range]{width:100%}output{display:block;margin-top:10px;color:#dec495}footer{position:fixed;bottom:18px;left:18px;background:#182725dc;padding:10px;border-radius:6px}a{color:#dec495}</style></head>
<body><aside><h1>Construction review</h1><p>Deterministic presentation fixture using the production assembly, worksite, crew, movement and articulation systems. Progress is supplied by this test fixture.</p>
<label for="material">Structure</label><select id="material"><option value="timber">Timber house · early</option><option value="masonry">Masonry hall · village</option><option value="ceramic">Brick house · pre-industrial</option><option value="earth">Earth house · early</option><option value="metal">Metal factory · industrial</option></select>
<label for="crew">Crew</label><select id="crew"><option value="3">Three workers</option><option value="1">Solo builder</option><option value="2">Two workers</option><option value="6">Six workers</option></select>
<label for="progress">Paid progress</label><input id="progress" type="range" min="0" max="1" step="0.000001" value="0.3">
<div id="stages"><button data-progress="0.1">Foundation</button><button data-progress="0.32">Frame</button><button data-progress="0.61">Walls</button><button data-progress="0.85">Roof</button><button data-progress="0.97">Finish</button><button data-progress="1">Complete</button></div>
<label><input id="blocked" type="checkbox"> Missing material</label><label><input id="work-blocked" type="checkbox"> Work interrupted</label>
<button id="play">Play full cycle</button><button id="pause">Pause progress</button><label for="speed">Cycle duration</label><select id="speed"><option value="120">120 seconds</option><option value="30">30 seconds</option></select>
<label for="distance">Viewing distance</label><select id="distance"><option value="close">Close</option><option value="medium">Medium</option><option value="far">Settlement</option></select>
<output id="status"></output><p><a href="/">Open simulation</a></p></aside><footer>Drag to orbit · scroll to zoom · progress pause keeps worker activity running</footer><script type="module" src="/src/dev/constructionReview.ts"></script></body></html>
