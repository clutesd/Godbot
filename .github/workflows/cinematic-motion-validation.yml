name: Cinematic motion validation

on:
  pull_request:
    paths:
      - 'src/historian/PresentationDirector.ts'
      - 'src/render/CameraDirector.ts'
      - 'tests/cinematic-presentation.test.ts'
      - '.github/workflows/cinematic-motion-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src/historian/PresentationDirector.ts src/render/CameraDirector.ts tests/cinematic-presentation.test.ts
      - run: npx vitest run tests/cinematic-presentation.test.ts tests/pacing.test.ts
      - run: npm run build
