name: Cinematic motion validation

on:
  push:
    branches:
      - main
    paths:
      - 'src/historian/PresentationDirector.ts'
      - 'src/render/CameraDirector.ts'
      - 'src/render/GodboxRenderer.ts'
      - 'src/render/people/PhysicalActionPresentation.ts'
      - 'src/render/people/PeopleVisualState.ts'
      - 'src/render/people/LocalActivityPresentation.ts'
      - 'src/render/people/RestPresentation.ts'
      - 'src/render/people/PeoplePresentation.ts'
      - 'src/render/founding/FoundingFirstFirePresentation.ts'
      - 'src/sim/people/PeopleSystem.ts'
      - 'src/sim/pressures/Survival.ts'
      - 'src/sim/pressures/types.ts'
      - 'tests/local-activity.test.ts'
      - 'tests/rest-presentation.test.ts'
      - 'tests/human-physical-presence.test.ts'
      - 'tests/documentary-human-cadence.test.ts'
      - 'tests/pressures.test.ts'
      - 'tests/founding-first-fire-presentation.test.ts'
      - 'tests/cinematic-presentation.test.ts'
      - 'tests/camera-forest-sightline.test.ts'
      - '.github/workflows/cinematic-motion-validation.yml'
  pull_request:
    paths:
      - 'src/historian/PresentationDirector.ts'
      - 'src/render/CameraDirector.ts'
      - 'src/render/GodboxRenderer.ts'
      - 'src/render/people/PhysicalActionPresentation.ts'
      - 'src/render/people/PeopleVisualState.ts'
      - 'src/render/people/LocalActivityPresentation.ts'
      - 'src/render/people/RestPresentation.ts'
      - 'src/render/people/PeoplePresentation.ts'
      - 'src/render/founding/FoundingFirstFirePresentation.ts'
      - 'src/sim/people/PeopleSystem.ts'
      - 'src/sim/pressures/Survival.ts'
      - 'src/sim/pressures/types.ts'
      - 'tests/local-activity.test.ts'
      - 'tests/rest-presentation.test.ts'
      - 'tests/human-physical-presence.test.ts'
      - 'tests/documentary-human-cadence.test.ts'
      - 'tests/pressures.test.ts'
      - 'tests/founding-first-fire-presentation.test.ts'
      - 'tests/cinematic-presentation.test.ts'
      - 'tests/camera-forest-sightline.test.ts'
      - '.github/workflows/cinematic-motion-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src/historian/PresentationDirector.ts src/render/CameraDirector.ts src/render/founding/FoundingFirstFirePresentation.ts src/render/people/LocalActivityPresentation.ts src/render/people/RestPresentation.ts src/render/people/PeopleVisualState.ts src/sim/people/PeopleSystem.ts tests/cinematic-presentation.test.ts tests/camera-forest-sightline.test.ts tests/local-activity.test.ts tests/rest-presentation.test.ts tests/human-physical-presence.test.ts tests/documentary-human-cadence.test.ts tests/founding-first-fire-presentation.test.ts
      - run: npx vitest run tests/cinematic-presentation.test.ts tests/camera-forest-sightline.test.ts tests/pacing.test.ts tests/local-activity.test.ts tests/human-physical-presence.test.ts tests/documentary-human-cadence.test.ts tests/founding-first-fire-presentation.test.ts tests/arrival-render.test.ts tests/pressures.test.ts
      - run: npm run build
