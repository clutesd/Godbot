name: Cinematic motion validation

on:
  push:
    branches:
      - main
    paths:
      - 'src/main.ts'
      - 'src/style.css'
      - 'src/ui/FooterControls.ts'
      - 'src/ui/RestartLifecycle.ts'
      - 'src/ui/OpeningReadinessGate.ts'
      - 'src/historian/PresentationDirector.ts'
      - 'src/render/Camera*.ts'
      - 'src/render/Cinematic*.ts'
      - 'src/render/ManualCameraController.ts'
      - 'src/render/ScreenSpaceComposition.ts'
      - 'src/render/GodboxRenderer.ts'
      - 'src/render/AdaptiveResolution.ts'
      - 'src/render/atmosphere/CinematicLightPolish.ts'
      - 'src/render/atmosphere/EnvironmentFrameState.ts'
      - 'src/render/vegetation/VegetationRenderer.ts'
      - 'src/render/wildlife/LandWildlifeRenderer.ts'
      - 'src/render/animation/AnimationController.ts'
      - 'src/render/people/**'
      - 'src/render/founding/**'
      - 'src/shared/FoundingCampLayout.ts'
      - 'src/sim/people/PeopleSystem.ts'
      - 'src/sim/pressures/**'
      - 'tests/camera-*.test.ts'
      - 'tests/cinematic-*.test.ts'
      - 'tests/human-camera-presence.test.ts'
      - 'tests/manual-camera-controller.test.ts'
      - 'tests/screen-space-composition.test.ts'
      - 'tests/documentary-human-cadence.test.ts'
      - 'tests/human-physical-presence.test.ts'
      - 'tests/local-activity.test.ts'
      - 'tests/rest-*.test.ts'
      - 'tests/founding-*.test.ts'
      - 'tests/arrival-render.test.ts'
      - 'tests/land-wildlife.test.ts'
      - 'tests/reaction-glyph-presentation.test.ts'
      - 'tests/pacing.test.ts'
      - 'tests/pressures.test.ts'
      - 'tests/footer-controls.test.ts'
      - 'tests/restart-lifecycle.test.ts'
      - 'tests/opening-readiness.test.ts'
      - 'tests/restart.test.ts'
      - '.github/workflows/cinematic-motion-validation.yml'
  pull_request:
    paths:
      - 'src/main.ts'
      - 'src/style.css'
      - 'src/ui/FooterControls.ts'
      - 'src/ui/RestartLifecycle.ts'
      - 'src/ui/OpeningReadinessGate.ts'
      - 'src/historian/PresentationDirector.ts'
      - 'src/render/Camera*.ts'
      - 'src/render/Cinematic*.ts'
      - 'src/render/ManualCameraController.ts'
      - 'src/render/ScreenSpaceComposition.ts'
      - 'src/render/GodboxRenderer.ts'
      - 'src/render/AdaptiveResolution.ts'
      - 'src/render/atmosphere/CinematicLightPolish.ts'
      - 'src/render/atmosphere/EnvironmentFrameState.ts'
      - 'src/render/vegetation/VegetationRenderer.ts'
      - 'src/render/wildlife/LandWildlifeRenderer.ts'
      - 'src/render/animation/AnimationController.ts'
      - 'src/render/people/**'
      - 'src/render/founding/**'
      - 'src/shared/FoundingCampLayout.ts'
      - 'src/sim/people/PeopleSystem.ts'
      - 'src/sim/pressures/**'
      - 'tests/camera-*.test.ts'
      - 'tests/cinematic-*.test.ts'
      - 'tests/human-camera-presence.test.ts'
      - 'tests/manual-camera-controller.test.ts'
      - 'tests/screen-space-composition.test.ts'
      - 'tests/documentary-human-cadence.test.ts'
      - 'tests/human-physical-presence.test.ts'
      - 'tests/local-activity.test.ts'
      - 'tests/rest-*.test.ts'
      - 'tests/founding-*.test.ts'
      - 'tests/arrival-render.test.ts'
      - 'tests/land-wildlife.test.ts'
      - 'tests/reaction-glyph-presentation.test.ts'
      - 'tests/pacing.test.ts'
      - 'tests/pressures.test.ts'
      - 'tests/footer-controls.test.ts'
      - 'tests/restart-lifecycle.test.ts'
      - 'tests/opening-readiness.test.ts'
      - 'tests/restart.test.ts'
      - '.github/workflows/cinematic-motion-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: >-
          npx eslint
          src/main.ts
          src/ui/FooterControls.ts
          src/ui/RestartLifecycle.ts
          src/ui/OpeningReadinessGate.ts
          src/historian/PresentationDirector.ts
          src/render/AdaptiveResolution.ts
          src/render/Camera*.ts
          src/render/Cinematic*.ts
          src/render/ManualCameraController.ts
          src/render/ScreenSpaceComposition.ts
          src/render/atmosphere/CinematicLightPolish.ts
          src/render/atmosphere/EnvironmentFrameState.ts
          src/render/GodboxRenderer.ts
          src/render/vegetation/VegetationRenderer.ts
          src/render/wildlife/LandWildlifeRenderer.ts
          src/render/animation/AnimationController.ts
          src/render/founding/FoundingFirstFirePresentation.ts
          src/shared/FoundingCampLayout.ts
          src/sim/pressures/Survival.ts
          src/render/people/LocalActivityPresentation.ts
          src/render/people/RestPresentation.ts
          src/render/people/RestChoreography.ts
          src/render/people/RestPoseRenderer.ts
          src/render/people/PeopleVisualState.ts
          src/render/people/ReactionGlyphRenderer.ts
          src/sim/people/PeopleSystem.ts
          tests/camera-*.test.ts
          tests/cinematic-*.test.ts
          tests/human-camera-presence.test.ts
          tests/manual-camera-controller.test.ts
          tests/footer-controls.test.ts
          tests/restart-lifecycle.test.ts
          tests/opening-readiness.test.ts
          tests/restart.test.ts
          tests/screen-space-composition.test.ts
          tests/land-wildlife.test.ts
          tests/local-activity.test.ts
          tests/rest-presentation.test.ts
          tests/rest-choreography.test.ts
          tests/rest-pose-renderer.test.ts
          tests/human-physical-presence.test.ts
          tests/documentary-human-cadence.test.ts
          tests/founding-first-fire-presentation.test.ts
          tests/reaction-glyph-presentation.test.ts
      - run: >-
          npx vitest run
          tests/camera-*.test.ts
          tests/cinematic-*.test.ts
          tests/human-camera-presence.test.ts
          tests/manual-camera-controller.test.ts
          tests/footer-controls.test.ts
          tests/restart-lifecycle.test.ts
          tests/opening-readiness.test.ts
          tests/restart.test.ts
          tests/screen-space-composition.test.ts
          tests/land-wildlife.test.ts
          tests/pacing.test.ts
          tests/local-activity.test.ts
          tests/rest-presentation.test.ts
          tests/rest-choreography.test.ts
          tests/rest-pose-renderer.test.ts
          tests/human-physical-presence.test.ts
          tests/documentary-human-cadence.test.ts
          tests/founding-first-fire-presentation.test.ts
          tests/reaction-glyph-presentation.test.ts
          tests/arrival-render.test.ts
          tests/pressures.test.ts
      - run: npm run build
