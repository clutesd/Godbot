name: Cinematic motion validation

on:
  pull_request:
    paths:
      - 'src/historian/PresentationDirector.ts'
      - 'src/render/CameraDirector.ts'
      - 'src/render/CameraForestClearance.ts'
      - 'src/render/vegetation/TreeMaterials.ts'
      - 'tests/camera-forest-sightline.test.ts'
      - 'tests/camera-canopy-dissolve.test.ts'
      - 'tests/camera-canopy-material-contract.test.ts'
      - 'tests/camera-forest-clearance.test.ts'
      - 'tests/cinematic-presentation.test.ts'
      - '.github/workflows/cinematic-motion-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Keep focused camera validation useful even when an unrelated repository-wide typecheck is red.
      - run: >-
          npx eslint
          src/historian/PresentationDirector.ts
          src/render/CameraDirector.ts
          src/render/CameraForestClearance.ts
          src/render/vegetation/TreeMaterials.ts
          tests/camera-forest-sightline.test.ts
          tests/camera-canopy-dissolve.test.ts
          tests/camera-canopy-material-contract.test.ts
          tests/camera-forest-clearance.test.ts
          tests/cinematic-presentation.test.ts
      - run: >-
          npx vitest run
          tests/camera-forest-sightline.test.ts
          tests/camera-canopy-dissolve.test.ts
          tests/camera-canopy-material-contract.test.ts
          tests/camera-forest-clearance.test.ts
          tests/cinematic-presentation.test.ts
          tests/pacing.test.ts
      - run: npm run typecheck
      - run: npm run build
