name: Settlement banner step two

on:
  push:
    branches:
      - feature/settlement-banner-identity-step2
    paths:
      - '.github/workflows/settlement-banner-step-two.yml'
      - 'scripts/apply-banner-step-two.py'
      - 'src/render/style/BannerIdentity.ts'
      - 'tests/banner-identity.test.ts'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply renderer integration
        run: python scripts/apply-banner-step-two.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint step two files
        run: npx eslint src/render/style/BannerIdentity.ts tests/banner-identity.test.ts src/render/GodboxRenderer.ts
      - name: Test banner identity
        run: npx vitest run tests/banner-identity.test.ts
      - name: Production build
        run: npm run build
      - name: Commit validated integration and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/settlement-banner-step-two.yml scripts/apply-banner-step-two.py
          git add src/render/GodboxRenderer.ts src/render/style/BannerIdentity.ts tests/banner-identity.test.ts
          git commit -m "Implement procedural settlement heraldry"
          git push origin HEAD:feature/settlement-banner-identity-step2
