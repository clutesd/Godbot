name: World resource validation

on:
  pull_request:
    paths:
      - 'src/sim/resources/**'
      - 'src/sim/world.ts'
      - 'tests/world-resources.test.ts'
      - '.github/workflows/resource-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src/sim/resources/WorldResources.ts src/sim/world.ts tests/world-resources.test.ts
      - run: npx vitest run tests/world-resources.test.ts
      - run: npm run build
