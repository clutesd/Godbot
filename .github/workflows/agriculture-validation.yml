name: Field agriculture validation
on:
  pull_request:
    paths:
      - 'src/sim/agriculture/**'
      - 'src/sim/Simulation.ts'
      - 'src/sim/types.ts'
      - 'src/sim/development/SettlementDevelopmentSystem.ts'
      - 'src/sim/development/WaterCivilization.ts'
      - 'src/sim/resources/MaterialUse.ts'
      - 'src/sim/environment/EnvironmentalModificationSystem.ts'
      - 'src/sim/people/PeopleSystem.ts'
      - 'src/shared/FarmGeometry.ts'
      - 'src/render/farming/**'
      - 'src/render/GodboxRenderer.ts'
      - 'tests/agriculture.test.ts'
      - '.github/workflows/agriculture-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src/sim/agriculture src/sim/Simulation.ts src/sim/types.ts src/sim/development/SettlementDevelopmentSystem.ts src/sim/development/WaterCivilization.ts src/sim/resources/MaterialUse.ts src/sim/environment/EnvironmentalModificationSystem.ts src/sim/people/PeopleSystem.ts src/shared/FarmGeometry.ts src/render/farming src/render/GodboxRenderer.ts tests/agriculture.test.ts tests/human-capital.test.ts
      - run: npx vitest run tests/agriculture.test.ts tests/human-capital.test.ts tests/farm-field-presentation.test.ts tests/physical-actions.test.ts tests/water-civilization.test.ts tests/architecture.test.ts tests/pressures.test.ts
      - run: npm run build
