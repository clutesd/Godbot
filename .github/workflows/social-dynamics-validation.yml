name: Social dynamics validation

on:
  pull_request:
    paths:
      - 'src/sim/people/SocialDynamicsSystem.ts'
      - 'src/sim/people/HistoricalImportance.ts'
      - 'src/render/people/PeoplePresentation.ts'
      - 'tests/social-dynamics.test.ts'
      - 'tests/people-presentation.test.ts'
      - '.github/workflows/social-dynamics-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src/sim/people/SocialDynamicsSystem.ts src/sim/people/HistoricalImportance.ts src/render/people/PeoplePresentation.ts tests/social-dynamics.test.ts tests/people-presentation.test.ts
      - run: npx vitest run tests/social-dynamics.test.ts tests/people-presentation.test.ts tests/people.test.ts
      - run: npm run build
