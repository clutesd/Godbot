name: Hydrology validation

on:
  pull_request:
    paths:
      - 'src/sim/terrain/Hydrology.ts'
      - 'src/sim/weather/WeatherSystem.ts'
      - 'tests/hydrology-budget.test.ts'
      - 'tests/weather.test.ts'
      - '.github/workflows/hydrology-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src/sim/terrain/Hydrology.ts src/sim/weather/WeatherSystem.ts tests/hydrology-budget.test.ts
      - run: npx vitest run tests/hydrology-budget.test.ts
      - run: npm run build
