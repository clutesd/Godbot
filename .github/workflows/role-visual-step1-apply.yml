name: Apply role visual step 1

on:
  push:
    branches:
      - feature/role-visual-language-step1
    paths:
      - 'scripts/apply-role-visual-step1.mjs'
      - '.github/workflows/role-visual-step1-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/role-visual-language-step1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/apply-role-visual-step1.mjs
      - run: npx vitest run tests/role-visual-profile.test.ts
      - run: npm run build

      - name: Commit validated renderer wiring and remove one-shot patch machinery
        shell: bash
        run: |
          rm scripts/apply-role-visual-step1.mjs
          rm .github/workflows/role-visual-step1-apply.yml
          git config user.name 'godbox-role-visual-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Wire occupational role colors into people renderer'
          git push origin HEAD:feature/role-visual-language-step1
