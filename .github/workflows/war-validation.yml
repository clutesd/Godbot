name: War system validation

on:
  push:
    paths:
      - 'src/config.ts'
      - 'src/sim/war/**'
      - 'src/sim/Simulation.ts'
      - 'src/render/war/**'
      - 'src/historian/WarStory.ts'
      - 'tests/war.test.ts'
      - 'tests/war-presentation.test.ts'
      - 'tests/military-capability.test.ts'
      - 'tests/military-combat.test.ts'
      - 'tests/fixtures/war.ts'
      - '.github/workflows/war-validation.yml'
  pull_request:
    paths:
      - 'src/config.ts'
      - 'src/sim/war/**'
      - 'src/sim/Simulation.ts'
      - 'src/render/war/**'
      - 'src/historian/WarStory.ts'
      - 'tests/war.test.ts'
      - 'tests/war-presentation.test.ts'
      - 'tests/military-capability.test.ts'
      - 'tests/military-combat.test.ts'
      - 'tests/fixtures/war.ts'
      - '.github/workflows/war-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint war system
        run: >-
          npx eslint
          src/sim/war/Campaign.ts
          src/sim/war/MilitaryCapability.ts
          src/sim/war/MilitaryCombat.ts
          src/sim/war/MilitaryCombatRuntime.ts
          src/render/war/BattleSpectacle.ts
          src/render/war/MilitaryVisualLanguage.ts
          src/render/war/WarRenderer.ts
          src/historian/WarStory.ts
          tests/war.test.ts
          tests/war-presentation.test.ts
          tests/military-capability.test.ts
          tests/military-combat.test.ts
          tests/fixtures/war.ts
      - name: Run war regression suite
        run: npx vitest run tests/war.test.ts tests/war-presentation.test.ts tests/military-capability.test.ts tests/military-combat.test.ts
      - name: Project-wide typecheck audit
        continue-on-error: true
        run: npm run typecheck
      - name: Project-wide production build audit
        continue-on-error: true
        run: npm run build
