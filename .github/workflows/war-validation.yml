name: War system validation

on:
  push:
    paths:
      - 'src/sim/war/**'
      - 'src/sim/Simulation.ts'
      - 'tests/war.test.ts'
      - 'tests/military-capability.test.ts'
      - 'tests/military-combat.test.ts'
      - 'tests/fixtures/war.ts'
      - '.github/workflows/war-validation.yml'
  pull_request:
    paths:
      - 'src/sim/war/**'
      - 'src/sim/Simulation.ts'
      - 'tests/war.test.ts'
      - 'tests/military-capability.test.ts'
      - 'tests/military-combat.test.ts'
      - 'tests/fixtures/war.ts'
      - '.github/workflows/war-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: >-
          npx eslint
          src/sim/war/Campaign.ts
          src/sim/war/MilitaryCapability.ts
          src/sim/war/MilitaryCombat.ts
          src/sim/war/MilitaryCombatRuntime.ts
          tests/war.test.ts
          tests/military-capability.test.ts
          tests/military-combat.test.ts
          tests/fixtures/war.ts
      - run: npx vitest run tests/war.test.ts tests/military-capability.test.ts tests/military-combat.test.ts
      - run: npm run build
