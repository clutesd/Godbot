name: Settlement banner step one

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/settlement-banner-step-one.yml'

permissions:
  contents: write

jobs:
  apply-banner-step-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply banner renderer update
        run: python scripts/apply-banner-step-one.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit step one and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/settlement-banner-step-one.yml scripts/apply-banner-step-one.py
          git add src/render/GodboxRenderer.ts
          git commit -m "Refine settlement banner visual language"
          git push origin HEAD:main
