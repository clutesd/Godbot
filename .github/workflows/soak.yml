name: Soak
# Whole-simulation runs over decades and centuries (tests tagged `soak`). Too slow for every
# change, so they run nightly and on demand.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - run: npm run test:soak -- --maxWorkers=4
