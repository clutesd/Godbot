name: Settlement banner step three

on:
  push:
    branches:
      - feature/settlement-banner-history-polish
    paths:
      - '.github/workflows/settlement-banner-step-three.yml'
      - 'scripts/apply-banner-step-three.py'
      - 'src/render/style/BannerLegacy.ts'
      - 'tests/banner-legacy.test.ts'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply renderer integration
        run: python scripts/apply-banner-step-three.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint final banner files
        run: npx eslint src/render/style/BannerLegacy.ts tests/banner-legacy.test.ts src/render/GodboxRenderer.ts
      - name: Test banner systems
        run: npx vitest run tests/banner-identity.test.ts tests/banner-legacy.test.ts
      - name: Production build
        run: npm run build
      - name: Commit validated final banner system and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/settlement-banner-step-three.yml scripts/apply-banner-step-three.py
          git add src/render/GodboxRenderer.ts src/render/style/BannerLegacy.ts tests/banner-legacy.test.ts
          git commit -m "Make settlement standards carry history"
          git push origin HEAD:feature/settlement-banner-history-polish
