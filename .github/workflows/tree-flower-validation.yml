name: Tree and flower validation

on:
  pull_request:
    paths:
      - 'src/render/vegetation/**'
      - 'src/render/terrain/TerrainDecor.ts'
      - 'src/main.ts'
      - 'tests/forest-lifecycle.test.ts'
      - 'tests/flower-field.test.ts'
      - '.github/workflows/tree-flower-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run tests/forest-lifecycle.test.ts tests/flower-field.test.ts
      - run: npm run build
