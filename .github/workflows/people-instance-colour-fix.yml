name: Apply people instance colour fix

on:
  push:
    branches:
      - fix/people-instance-colour-contract

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/people-instance-colour-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-people-instance-colour-fix.mjs
      - run: npx vitest run tests/role-visual-profile.test.ts tests/role-garment-presentation.test.ts tests/people-instance-colour-contract.test.ts
      - run: npm run build
      - name: Commit validated renderer fix and remove one-shot patch machinery
        run: |
          rm scripts/apply-people-instance-colour-fix.mjs
          rm .github/workflows/people-instance-colour-fix.yml
          git config user.name "godbox-instance-colour-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix people instance colour rendering"
          git push origin HEAD:fix/people-instance-colour-contract
